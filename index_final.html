<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061827"><title>Pimentel Diagnóstico AC</title><style>*{box-sizing:border-box}body{margin:0;background:#020a12;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:560px;min-height:100vh;margin:auto;padding:18px 15px 35px;background:linear-gradient(180deg,#061827,#03101a)}header{text-align:center;padding:8px 0 18px}.logo{font-weight:900;font-size:23px}.logo span{color:#12adff}.tag{font-size:12px;color:#75d9ff}.card{background:#0b2538;border:1px solid #20516d;border-radius:17px;padding:17px;margin:11px 0}.hero{text-align:center;padding:26px 17px}.snow{font-size:50px}.muted{color:#a8bfcc;line-height:1.45;font-size:14px}button,a.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;margin:7px 0;text-align:center;text-decoration:none;color:#fff;background:#10324a;font-size:16px;font-weight:750}.primary{background:linear-gradient(90deg,#008ff0,#13b4ff)!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid button{margin:0}.hidden{display:none}label{display:block;color:#a8bfcc;font-size:13px;margin:11px 0 5px}input,select,textarea{width:100%;padding:13px;border-radius:10px;border:1px solid #2a5873;background:#061a28;color:#fff;font-size:16px}.option{text-align:left}.result{border-left:4px solid #16b4ff}.ok{color:#55e58a}.warn{color:#ffd45c}.note{padding:12px;border-radius:10px;background:#082b40;color:#b9d5e2;font-size:13px;margin-top:10px}.top{display:flex;align-items:center;gap:10px;margin:3px 0 15px}.top button{width:auto;margin:0;padding:9px 13px}.step{margin-left:auto;color:#70d5ff;font-size:12px}h2{font-size:20px}h3{margin-bottom:8px}.case{border-top:1px solid #20516d;padding:12px 0}.small{font-size:12px;color:#91adba}.danger{color:#ff9c9c}</style></head><body><div class="app"><header><div class="logo">❄ PIMENTEL <span>DIAGNÓSTICO AC</span></div><div class="tag">Climatizando com Confiança!</div></header><main id="app"></main></div><script>
const DB={Gree:{E1:['Alta pressão','Verificar condensador, ventilação, excesso de refrigerante e obstruções.'],E2:['Proteção anticongelamento da evaporadora','Verificar fluxo de ar, filtro, ventilador e condições do evaporador.'],E3:['Baixa pressão','Verificar carga de refrigerante, vazamento, restrição e fluxo de ar.'],E4:['Alta temperatura de descarga do compressor','Verificar carga, superaquecimento, ventilação e condições do compressor.'],E5:['Proteção por sobrecorrente','Verificar alimentação, corrente, compressor e placa/módulo.']},LG:{CH38:['Falta/baixa carga de refrigerante — confirmar no manual do modelo','Verificar vazamento, carga e condições do circuito.'],CH61:['Proteção relacionada à temperatura/condensação — confirmar pelo modelo','Verificar temperatura externa, serpentina, ventilação e instalação.'],CH54:['Falha/proteção elétrica — confirmar pelo modelo','Verificar alimentação, sequência/fase quando aplicável e placa.']},Midea:{E1:['Código dependente do modelo','Consultar manual específico antes de substituir peças.'],E4:['Código dependente do modelo','Consultar manual específico e medir sensores/comunicação.']},Elgin:{E1:['Código dependente do modelo','Consultar manual específico.'],E4:['Código dependente do modelo','Consultar manual específico.']},Samsung:{E1:['Código dependente do modelo','Consultar manual específico.'],E4:['Código dependente do modelo','Consultar manual específico.']},Daikin:{U4:['Falha de comunicação entre unidades — confirmar modelo','Verificar alimentação, cabeamento, bornes e placas.']},Fujitsu:{E1:['Código dependente do modelo','Consultar manual específico.']}};
const state={};let tests=[];function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(){document.getElementById('app').innerHTML=`<section class="card hero"><div class="snow">❄️</div><h1>Assistente técnico</h1><p class="muted">Diagnóstico passo a passo para split convencional, inverter, piso-teto, cassete e janela.</p><button class="primary" onclick="start()">🔧 Novo diagnóstico</button></section><div class="grid"><button onclick="errors()">⚠️ Códigos de erro</button><button onclick="historyView()">📋 Histórico</button><button onclick="tech()">📚 Base técnica</button><button onclick="settings()">⚙️ Configurações</button></div>`}function start(){Object.keys(state).forEach(k=>delete state[k]);tests=[];step1()}function top(t,n){return `<div class="top"><button onclick="render()">←</button><b>${t}</b><span class="step">${n}/5</span></div>`}function step1(){document.getElementById('app').innerHTML=top('Novo diagnóstico',1)+`<div class="card"><h2>Qual o equipamento?</h2>${['Split Convencional','Split Inverter','Piso-Teto','Cassete','Janela','Outro'].map(x=>`<button class="option" onclick="state.equip='${x}';step2()">${x}</button>`).join('')}</div>`}function step2(){document.getElementById('app').innerHTML=top('Marca e modelo',2)+`<div class="card"><label>Marca</label><select id="brand">${Object.keys(DB).map(x=>`<option>${x}</option>`).join('')}</select><label>Modelo</label><input id="model" placeholder="Ex.: G-Top Inverter"><label>Refrigerante</label><select id="ref"><option>R32</option><option>R410A</option><option>R22</option><option>R134a</option><option>Outro</option></select><label>Capacidade</label><select id="btus"><option>9.000 BTUs</option><option>12.000 BTUs</option><option>18.000 BTUs</option><option>24.000 BTUs</option><option>30.000 BTUs</option></select><button class="primary" onclick="state.brand=brand.value;state.model=model.value;state.ref=ref.value;state.btus=btus.value;step3()">Avançar →</button></div>`}function step3(){let opts=['Não liga','Liga e desarma','Não aciona o compressor','Não gela','Ventilador não funciona','Código de erro no display','Pressão anormal','Outro'];document.getElementById('app').innerHTML=top('Sintoma',3)+`<div class="card"><h2>Qual o problema?</h2>${opts.map(x=>`<button class="option" onclick="state.symptom='${x}';step4()">${x}</button>`).join('')}</div>`}function step4(){document.getElementById('app').innerHTML=top('Medições',4)+`<div class="card"><label>Tensão (V)</label><input id="volt" type="number"><label>Corrente (A)</label><input id="amp" type="number" step="0.1"><label>Pressão de sucção (PSI)</label><input id="psi" type="number"><label>Temperatura ambiente (°C)</label><input id="amb" type="number"><label>Temperatura de retorno (°C)</label><input id="ret" type="number"><label>Temperatura de insuflamento (°C)</label><input id="sup" type="number"><div id="dt" class="note">Informe retorno e insuflamento para calcular ΔT.</div><button class="primary" onclick="saveMeasures();step5()">Avançar →</button></div>`;['ret','sup'].forEach(id=>document.getElementById(id).addEventListener('input',calcDT))}function calcDT(){let r=parseFloat(ret.value),s=parseFloat(sup.value);dt.textContent=Number.isFinite(r)&&Number.isFinite(s)?`ΔT calculado: ${(r-s).toFixed(1)} °C`:'Informe retorno e insuflamento para calcular ΔT.'}function saveMeasures(){state.measures={volt:volt.value,amp:amp.value,psi:psi.value,amb:amb.value,ret:ret.value,sup:sup.value,dt:(parseFloat(ret.value)-parseFloat(sup.value))}}function step5(){let choices=['Alimentação normal','Alimentação fora da faixa','Sensor dentro da faixa','Sensor fora da faixa','Comunicação normal','Falha de comunicação','Ainda não testado'];document.getElementById('app').innerHTML=top('Teste principal',5)+`<div class="card"><h2>O que você encontrou?</h2>${choices.map(x=>`<button class="option" onclick="finish('${x}')">${x}</button>`).join('')}</div>`}function finish(test){tests=[test];state.test=test;let causes=[];if(test==='Alimentação fora da faixa')causes.push(['Alimentação elétrica fora da faixa','Alta']);if(test==='Falha de comunicação')causes.push(['Falha de comunicação entre unidades','Alta']);if(test==='Sensor fora da faixa')causes.push(['Sensor de temperatura fora da faixa','Alta']);if(state.symptom==='Não gela')causes.push(['Baixo desempenho térmico: verificar carga, fluxo de ar e trocas térmicas','Média']);if(state.symptom==='Não aciona o compressor')causes.push(['Proteção eletrônica, comunicação, alimentação ou comando do compressor','Média']);if(!causes.length)causes.push(['Causa ainda não confirmada; continuar testes orientados','Baixa']);let rec=causes[0][0];let item={date:new Date().toLocaleString('pt-BR'),...state,causes};let h=JSON.parse(localStorage.getItem('pimentel_cases')||'[]');h.unshift(item);localStorage.setItem('pimentel_cases',JSON.stringify(h));document.getElementById('app').innerHTML=`<div class="top"><button onclick="step5()">←</button><b>Resultado</b></div><div class="card result"><h2>🔎 Diagnóstico concluído</h2><p class="muted">Resultado orientativo — confirme com medições e procedimento do fabricante.</p>${causes.map((c,i)=>`<div class="case"><b>${i+1}. ${esc(c[0])}</b><div class="small">Confiança: ${c[1]}</div></div>`).join('')}<div class="note"><b>Próximo passo:</b><br>${esc(rec)}</div></div><button class="primary" onclick="report()">📄 Ver relatório</button><button onclick="historyView()">📋 Histórico</button>`}function errors(){document.getElementById('app').innerHTML=`<div class="top"><button onclick="render()">←</button><b>Códigos de erro</b></div><div class="card"><label>Marca</label><select id="eb">${Object.keys(DB).map(x=>`<option>${x}</option>`).join('')}</select><label>Código</label><input id="ec" placeholder="Ex.: E4"><button class="primary" onclick="lookupError()">Consultar</button><div id="er"></div></div>`}function lookupError(){let b=eb.value,c=ec.value.trim().toUpperCase(),d=DB[b]?.[c];er.innerHTML=d?`<div class="note"><h3>${esc(b)} ${esc(c)}</h3><b>${esc(d[0])}</b><p>${esc(d[1])}</p><p class="warn">⚠️ Confirme no manual do modelo antes de trocar componentes.</p></div>`:`<div class="note">Código não encontrado na base atual. O significado pode variar conforme o modelo. Informe marca + modelo e consulte o manual do fabricante.</div>`}function historyView(){let h=JSON.parse(localStorage.getItem('pimentel_cases')||'[]');document.getElementById('app').innerHTML=`<div class="top"><button onclick="render()">←</button><b>Histórico</b></div><div class="card">${h.length?h.map((x,i)=>`<div class="case"><b>${esc(x.brand)} ${esc(x.model||'')}</b><div>${esc(x.symptom||'')}</div><div class="small">${esc(x.date||'')}</div><button onclick="showCase(${i})">Ver atendimento</button></div>`).join(''):'<p class="muted">Nenhum atendimento salvo neste aparelho.</p>'}<button onclick="localStorage.removeItem('pimentel_cases');historyView()">Limpar histórico</button></div>`}function showCase(i){let h=JSON.parse(localStorage.getItem('pimentel_cases')||'[]'),x=h[i];document.getElementById('app').innerHTML=`<div class="top"><button onclick="historyView()">←</button><b>Atendimento</b></div><div class="card"><h2>${esc(x.brand)} ${esc(x.model||'')}</h2><p>Equipamento: ${esc(x.equip)}</p><p>Defeito: ${esc(x.symptom)}</p><p>Teste: ${esc(x.test)}</p><p>ΔT: ${Number.isFinite(x.measures?.dt)?x.measures.dt.toFixed(1)+' °C':'—'}</p>${(x.causes||[]).map(c=>`<div class="case">${esc(c[0])} — ${esc(c[1])}</div>`).join('')}</div>`}function report(){historyView()}function tech(){document.getElementById('app').innerHTML=`<div class="top"><button onclick="render()">←</button><b>Base técnica</b></div><div class="card"><h2>📐 Medições</h2><p class="muted">Use tensão, corrente, pressão e temperaturas em conjunto. ΔT = retorno − insuflamento.</p><p class="muted">Pressões não devem ser avaliadas isoladamente: dependem de refrigerante, temperatura ambiente, carga térmica e condições do equipamento.</p></div><div class="card"><h2>🔧 Inverter</h2><p class="muted">Antes de condenar compressor ou módulo, confirme alimentação, comunicação, sensores e proteções conforme o manual do fabricante.</p></div>`}function settings(){document.getElementById('app').innerHTML=`<div class="top"><button onclick="render()">←</button><b>Configurações</b></div><div class="card"><label>Técnico</label><input id="techname" placeholder="Seu nome"><label>Empresa</label><input value="Thiago Pimentel Ar-Condicionado"><button class="primary" onclick="localStorage.setItem('pimentel_tech',techname.value);alert('Configuração salva!')">Salvar</button></div>`}render();</script></body></html>
